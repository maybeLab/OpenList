name: Test Docker Image

on:
  push:
    branches:
      - codex/smb-test-image-amd64-ffmpeg
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/maybelab/openlist-test
  IMAGE_TAG: smb-session-amd64-ffmpeg

jobs:
  build_image:
    name: Build linux/amd64 ffmpeg image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - name: Setup web
        run: bash build.sh beta web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build linux/amd64 musl binary
        uses: OpenListTeam/cgo-actions@v1.2.2
        with:
          targets: linux-amd64-musl
          flags: -ldflags=-linkmode external -extldflags '-static -fpic'
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=beta
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist

      - name: Prepare Docker build layout
        run: |
          set -euo pipefail
          mkdir -p build/linux/amd64
          mv build/openlist build/linux/amd64/openlist

      - name: Verify binary is static
        run: |
          set -euo pipefail
          if readelf -l build/linux/amd64/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/linux/amd64/openlist"
            readelf -l build/linux/amd64/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          build-args: |
            BASE_IMAGE_TAG=ffmpeg
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Print image
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
